<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A chat bubble carrying an image and a file handle connects to the CANNBOT gateway">
  <!-- left: chat bubble with an image thumbnail and a file handle -->
  <rect x="56" y="72" width="224" height="156" rx="18" fill="none" stroke="#2f7d7a" stroke-width="5"/>
  <path d="M96 228 L96 262 L142 228" fill="none" stroke="#2f7d7a" stroke-width="5" stroke-linejoin="round"/>
  <rect x="86" y="98" width="76" height="58" rx="8" fill="#2f7d7a" opacity="0.18"/>
  <circle cx="118" cy="118" r="9" fill="#e0a23c"/>
  <path d="M95 146 L112 128 L128 144 L140 134 L153 146" fill="none" stroke="#2f7d7a" stroke-width="4" stroke-linejoin="round"/>
  <rect x="180" y="102" width="76" height="10" rx="5" fill="#2f7d7a" opacity="0.55"/>
  <rect x="180" y="124" width="60" height="10" rx="5" fill="#2f7d7a" opacity="0.35"/>
  <rect x="86" y="176" width="170" height="34" rx="9" fill="none" stroke="#6b7280" stroke-width="3"/>
  <path d="M108 186 h18 l8 8 h14" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108 198 h44" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>

  <!-- connection -->
  <path d="M286 150 H360" fill="none" stroke="#6b7280" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
  <circle cx="330" cy="150" r="7" fill="#e0a23c"/>

  <!-- right: gateway node with three ports -->
  <rect x="368" y="92" width="200" height="116" rx="20" fill="none" stroke="#2f7d7a" stroke-width="5"/>
  <circle cx="404" cy="150" r="12" fill="#2f7d7a" opacity="0.25"/>
  <circle cx="404" cy="150" r="5" fill="#2f7d7a"/>
  <circle cx="462" cy="150" r="5" fill="#2f7d7a"/>
  <circle cx="520" cy="150" r="5" fill="#2f7d7a"/>
  <path d="M404 150 H462 M462 150 H520" fill="none" stroke="#2f7d7a" stroke-width="4" opacity="0.6"/>
  <path d="M520 150 V112" fill="none" stroke="#2f7d7a" stroke-width="4" opacity="0.6"/>
  <path d="M520 112 h22" fill="none" stroke="#e0a23c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="548" cy="112" r="7" fill="#e0a23c"/>
</svg>
