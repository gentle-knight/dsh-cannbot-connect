# Register the CANNBOT provider without changing the profile's default model.
# The plugin re-reads CANNWork's sign-in (session.json) and the CANNBOT VK
# (auth.json) on every request, so a login or token refresh in the extension
# reaches the next DSH request with no restart.
#
# For editors that are not DSH (VS Code's chat sidebar, Cline/Continue, …) the
# same repository can serve the gateway over loopback as an OpenAI-compatible
# endpoint. It is off by default because it opens a listening socket; enable it
# with the block below, or run `node lib/local-server.js` instead (see README §4):
#
#     - id: llm-cannbot
#       name: dsh-cannbot-connect
#       config:
#         localServer:
#           enabled: true
#           port: 8788
- insert:
    - id: llm-cannbot
      name: dsh-cannbot-connect
